<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback — Eggspress</title>
<style>
  :root{ --rood:#E0281C; --crème:#FAF6EE; --rand:#EAE1CF; --tekst:#241C14; --muted:#8C7F6B; }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--crème);color:var(--tekst);margin:0;padding:28px 14px 60px;}
  .kaart{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--rand);border-radius:16px;overflow:hidden;box-shadow:0 2px 18px rgba(36,28,20,.05)}
  .kop{background:var(--rood);padding:26px 26px 22px;text-align:center}
  .kop img{height:26px;width:auto;background:#fff;padding:8px 16px;border-radius:8px;display:inline-block;margin-bottom:14px}
  .kop .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:4px}
  .kop h1{font-size:20px;color:#fff;margin:0;font-weight:800}
  .lijf{padding:26px}
  .lijf > p.intro{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 22px}
  label{display:block;font-size:13px;font-weight:700;color:var(--tekst);margin:20px 0 8px;line-height:1.4}
  .vraag:first-of-type label{margin-top:0}
  .schaal{display:flex;gap:6px;flex-wrap:wrap}
  .schaal-getal{width:34px;height:34px;border-radius:8px;border:1px solid var(--rand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;user-select:none;background:#fff;color:var(--tekst)}
  .schaal-getal.aan{background:var(--rood);border-color:var(--rood);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--rand);border-radius:20px;padding:8px 14px;font-size:12.5px;cursor:pointer;background:var(--crème);user-select:none}
  .chip.aan{background:var(--rood);border-color:var(--rood);color:#fff;font-weight:700}
  .jn{display:flex;gap:10px}
  .jn button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--rand);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--tekst)}
  .jn button.aan{background:var(--rood);border-color:var(--rood);color:#fff}
  textarea{width:100%;padding:11px 13px;border:1px solid var(--rand);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;resize:vertical;min-height:64px}
  textarea:focus,input:focus{outline:2px solid var(--rood);outline-offset:-1px}
  button.verstuur{margin-top:26px;width:100%;background:var(--rood);color:#fff;border:none;font-weight:700;font-size:15px;padding:15px 20px;border-radius:10px;cursor:pointer}
  button.verstuur:disabled{background:#D9CFC0;cursor:not-allowed}
  .fout{color:#B3261E;font-size:13px;margin-top:12px}
  .voettekst{text-align:center;font-size:10.5px;color:var(--muted);margin-top:16px}
  .bedankt{text-align:center;padding:20px 0}
  .bedankt .emoji{font-size:44px;margin-bottom:10px}
</style>
</head>
<body>
<div class="kaart">
  <div class="kop">
    <img src="https://www.eggspress.nl/wp-content/uploads/2026/03/eggspress.svg" alt="Eggspress">
    <div class="eyebrow">Zou u willen helpen?</div>
    <h1 id="kop-titel">Bezig...</h1>
  </div>
  <div class="lijf" id="inhoud"><p class="intro">Een moment geduld.</p></div>
</div>
<script>
const SB_URL = 'https://ckpxdkodiaxpsfmackat.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcHhka29kaWF4cHNmbWFja2F0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MDcyODksImV4cCI6MjA5NzA4MzI4OX0.kzzUr4AGPcypNXPoBWyb2WpKpK8Gq2fNyFfb9UJGiL0';

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function metNaam(tekst, naam){ return (tekst||'').replaceAll('{naam}', naam); }

async function sbGet(pad){
  const res = await fetch(`${SB_URL}/rest/v1/${pad}`, { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
  return res.json();
}

// Bouwt één vraagblok op basis van het type uit feedback_vragen — de vragenlijst zelf is
// instelbaar via het dashboard (Instellingen), dus hardcoden we hier geen tekst/opties meer.
function vraagHtml(v, naam){
  const label = `<label for="${v.veld}">${esc(metNaam(v.label, naam))}${v.verplicht ? '' : ' <span style="font-weight:400;color:var(--muted)">(optioneel)</span>'}</label>`;
  if (v.type === 'schaal') {
    const getallen = Array.from({length:10}, (_,i) => i+1).map(n => `<span class="schaal-getal" data-veld="${v.veld}" data-w="${n}">${n}</span>`).join('');
    return `<div class="vraag">${label}<div class="schaal" id="schaal-${v.veld}">${getallen}</div></div>`;
  }
  if (v.type === 'checkboxes') {
    const opties = Array.isArray(v.opties) ? v.opties : [];
    return `<div class="vraag">${label}<div class="chips" id="chips-${v.veld}">${opties.map(o => `<div class="chip" data-veld="${v.veld}" data-w="${esc(o)}">${esc(o)}</div>`).join('')}</div></div>`;
  }
  if (v.type === 'ja_nee') {
    return `<div class="vraag">${label}
      <div class="jn" id="jn-${v.veld}"><button type="button" data-veld="${v.veld}" data-w="ja">Ja</button><button type="button" data-veld="${v.veld}" data-w="nee">Nee</button></div>
      <textarea id="toelichting-${v.veld}" placeholder="Toelichting (optioneel)" style="margin-top:10px"></textarea>
    </div>`;
  }
  // 'open'
  return `<div class="vraag">${label}<textarea id="open-${v.veld}"></textarea></div>`;
}

(async () => {
  const inhoud = document.getElementById('inhoud');
  const kopTitel = document.getElementById('kop-titel');
  const vk = new URLSearchParams(window.location.search).get('vk');
  if (!vk) { kopTitel.textContent = 'Ongeldige link'; inhoud.innerHTML = '<p class="intro">Er ontbreekt een verkoper-ID in deze link.</p>'; return; }

  let verkoper, vragen;
  try {
    const [verkoperRijen, vraagRijen] = await Promise.all([
      sbGet(`verkopers?id=eq.${encodeURIComponent(vk)}&select=id,voornaam,nummer`),
      sbGet(`feedback_vragen?actief=eq.true&select=*&order=volgorde`),
    ]);
    verkoper = verkoperRijen[0];
    vragen = vraagRijen;
  } catch (e) { kopTitel.textContent = 'Er ging iets mis'; inhoud.innerHTML = '<p class="intro">Probeer het later nog eens.</p>'; return; }
  if (!verkoper) { kopTitel.textContent = 'Niet gevonden'; inhoud.innerHTML = '<p class="intro">Deze link klopt niet (meer).</p>'; return; }

  const naam = verkoper.voornaam || 'uw verkoper';
  kopTitel.textContent = `Help ${naam} verder!`;

  const antwoorden = {}; // veld -> waarde (schaal: getal, checkboxes: Set, ja_nee: 'ja'/'nee', open: string via .value)

  inhoud.innerHTML = `
    <p class="intro">Uw mening maakt het verschil voor ${esc(naam)} om een betere verkoper te worden! Vul in 2 minuten deze korte vragenlijst in — dat helpt enorm.</p>
    ${vragen.map(v => vraagHtml(v, naam)).join('')}
    <button class="verstuur" id="btn-verstuur">Versturen</button>
    <div class="fout" id="fout" style="display:none"></div>
    <div class="voettekst">Uw antwoorden gaan rechtstreeks naar Eggspress en helpen ${esc(naam)} persoonlijk verder.</div>
  `;

  document.querySelectorAll('.schaal-getal').forEach(el => {
    el.addEventListener('click', () => {
      const veld = el.dataset.veld, w = +el.dataset.w;
      antwoorden[veld] = w;
      document.querySelectorAll(`#schaal-${veld} .schaal-getal`).forEach(s => s.classList.toggle('aan', +s.dataset.w <= w));
    });
  });
  document.querySelectorAll('.chips .chip').forEach(el => {
    el.addEventListener('click', () => {
      const veld = el.dataset.veld, w = el.dataset.w;
      if (!antwoorden[veld]) antwoorden[veld] = new Set();
      if (antwoorden[veld].has(w)) { antwoorden[veld].delete(w); el.classList.remove('aan'); }
      else { antwoorden[veld].add(w); el.classList.add('aan'); }
    });
  });
  document.querySelectorAll('.jn button').forEach(el => {
    el.addEventListener('click', () => {
      const veld = el.dataset.veld;
      antwoorden[veld] = el.dataset.w === 'ja';
      document.querySelectorAll(`#jn-${veld} button`).forEach(b => b.classList.toggle('aan', b === el));
    });
  });

  document.getElementById('btn-verstuur').addEventListener('click', async () => {
    const foutEl = document.getElementById('fout');
    foutEl.style.display = 'none';

    const ontbrekend = vragen.filter(v => v.verplicht && (antwoorden[v.veld] === undefined || antwoorden[v.veld] === null));
    if (ontbrekend.length) {
      foutEl.textContent = `Vul in elk geval in: ${ontbrekend.map(v => metNaam(v.label, naam)).join(', ')}`;
      foutEl.style.display = ''; return;
    }

    const payload = {};
    let aanbevelingToelichting = '';
    vragen.forEach(v => {
      if (v.type === 'open') {
        const val = document.getElementById(`open-${v.veld}`).value.trim();
        if (val) payload[v.veld] = val;
      } else if (v.type === 'checkboxes') {
        if (antwoorden[v.veld]?.size) payload[v.veld] = [...antwoorden[v.veld]];
      } else if (v.type === 'ja_nee') {
        if (antwoorden[v.veld] !== undefined) payload[v.veld] = antwoorden[v.veld];
        const toel = document.getElementById(`toelichting-${v.veld}`)?.value.trim();
        if (toel && v.veld === 'aanbeveling') aanbevelingToelichting = toel;
      } else if (v.type === 'schaal') {
        if (antwoorden[v.veld] !== undefined) payload[v.veld] = antwoorden[v.veld];
      }
    });

    const btn = document.getElementById('btn-verstuur');
    btn.disabled = true; btn.textContent = 'Bezig...';
    try {
      const res = await fetch(`${SB_URL}/functions/v1/feedback-opslaan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${SB_KEY}` },
        body: JSON.stringify({ verkoper_id: verkoper.id, antwoorden: payload, aanbeveling_toelichting: aanbevelingToelichting }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.fout || 'onbekende fout');
      kopTitel.textContent = 'Bedankt! ✓';
      // Alleen tevreden klanten vragen om ook een Google-review achter te laten — bij een
      // lage score zou dat averechts werken (dan liever alleen de interne feedback).
      const schaalScores = vragen.filter(v => v.type === 'schaal').map(v => payload[v.veld]).filter(n => n !== undefined);
      const gemScore = schaalScores.length ? schaalScores.reduce((s,n)=>s+n,0) / schaalScores.length : 0;
      const reviewBlok = gemScore >= 8 ? `
        <div style="margin-top:20px;padding:16px;background:var(--crème);border:1px solid var(--rand);border-radius:10px">
          <p style="font-size:13px;line-height:1.5;margin:0 0 12px">U zou ons enorm helpen door ook een review op Google achter te laten! ⭐</p>
          <a href="https://search.google.com/local/writereview?ftid=0x47c7c79a56b939ff:0x7a18aee96eec61e3" target="_blank" rel="noopener" style="display:inline-block;background:var(--rood);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:11px 20px;border-radius:8px">Review achterlaten op Google</a>
        </div>` : '';
      inhoud.innerHTML = `<div class="bedankt"><div class="emoji">🙏</div><p class="intro" style="margin:0">Ontzettend bedankt voor uw tijd — ${esc(naam)} is hier heel blij mee!</p>${reviewBlok}</div>`;
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Versturen';
      foutEl.textContent = 'Versturen mislukt: ' + e.message; foutEl.style.display = '';
    }
  });
})();
</script>
</body>
</html>
