<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback — Eggspress</title>
<style>
  :root{ --rood:#E0281C; --crème:#FAF6EE; --rand:#EAE1CF; --tekst:#241C14; --muted:#8C7F6B; }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--crème);color:var(--tekst);margin:0;padding:28px 14px 60px;}
  .kaart{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--rand);border-radius:16px;overflow:hidden;box-shadow:0 2px 18px rgba(36,28,20,.05)}
  .kop{background:var(--rood);padding:26px 26px 22px;text-align:center}
  .kop img{height:26px;width:auto;background:#fff;padding:8px 16px;border-radius:8px;display:inline-block;margin-bottom:14px}
  .kop .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:4px}
  .kop h1{font-size:20px;color:#fff;margin:0;font-weight:800}
  .lijf{padding:26px}
  .lijf > p.intro{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 22px}
  label{display:block;font-size:13px;font-weight:700;color:var(--tekst);margin:20px 0 8px;line-height:1.4}
  label:first-of-type{margin-top:0}
  .sterren{display:flex;gap:6px}
  .ster{font-size:30px;cursor:pointer;color:var(--rand);user-select:none;line-height:1;transition:color .1s}
  .ster.aan{color:var(--rood)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--rand);border-radius:20px;padding:8px 14px;font-size:12.5px;cursor:pointer;background:var(--crème);user-select:none}
  .chip.aan{background:var(--rood);border-color:var(--rood);color:#fff;font-weight:700}
  .jn{display:flex;gap:10px}
  .jn button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--rand);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--tekst)}
  .jn button.aan{background:var(--rood);border-color:var(--rood);color:#fff}
  textarea{width:100%;padding:11px 13px;border:1px solid var(--rand);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;resize:vertical;min-height:64px}
  textarea:focus,input:focus{outline:2px solid var(--rood);outline-offset:-1px}
  button.verstuur{margin-top:26px;width:100%;background:var(--rood);color:#fff;border:none;font-weight:700;font-size:15px;padding:15px 20px;border-radius:10px;cursor:pointer}
  button.verstuur:disabled{background:#D9CFC0;cursor:not-allowed}
  .fout{color:#B3261E;font-size:13px;margin-top:12px}
  .voettekst{text-align:center;font-size:10.5px;color:var(--muted);margin-top:16px}
  .bedankt{text-align:center;padding:20px 0}
  .bedankt .emoji{font-size:44px;margin-bottom:10px}
</style>
</head>
<body>
<div class="kaart">
  <div class="kop">
    <img src="https://www.eggspress.nl/wp-content/uploads/2026/03/eggspress.svg" alt="Eggspress">
    <div class="eyebrow">Zou u willen helpen?</div>
    <h1 id="kop-titel">Bezig...</h1>
  </div>
  <div class="lijf" id="inhoud"><p class="intro">Een moment geduld.</p></div>
</div>
<script>
const SB_URL = 'https://ckpxdkodiaxpsfmackat.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcHhka29kaWF4cHNmbWFja2F0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MDcyODksImV4cCI6MjA5NzA4MzI4OX0.kzzUr4AGPcypNXPoBWyb2WpKpK8Gq2fNyFfb9UJGiL0';
const KOOPREDENEN = ['Verse eieren', 'Gemak / thuisbezorgd', 'Lokaal / steun een jonge ondernemer', 'Prijs', 'Kwaliteit', 'Anders'];

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

async function sbGet(pad){
  const res = await fetch(`${SB_URL}/rest/v1/${pad}`, { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
  return res.json();
}

function sterrenHtml(veld, label){
  const sterren = [1,2,3,4,5].map(n => `<span class="ster" data-veld="${veld}" data-w="${n}">★</span>`).join('');
  return `<label>${esc(label)}</label><div class="sterren" id="sterren-${veld}">${sterren}</div>`;
}

(async () => {
  const inhoud = document.getElementById('inhoud');
  const kopTitel = document.getElementById('kop-titel');
  const vk = new URLSearchParams(window.location.search).get('vk');
  if (!vk) { kopTitel.textContent = 'Ongeldige link'; inhoud.innerHTML = '<p class="intro">Er ontbreekt een verkoper-ID in deze link.</p>'; return; }

  let verkoper;
  try {
    const rijen = await sbGet(`verkopers?id=eq.${encodeURIComponent(vk)}&select=id,voornaam,nummer`);
    verkoper = rijen[0];
  } catch (e) { kopTitel.textContent = 'Er ging iets mis'; inhoud.innerHTML = '<p class="intro">Probeer het later nog eens.</p>'; return; }
  if (!verkoper) { kopTitel.textContent = 'Niet gevonden'; inhoud.innerHTML = '<p class="intro">Deze link klopt niet (meer).</p>'; return; }

  const naam = verkoper.voornaam || 'uw verkoper';
  kopTitel.textContent = `Help ${naam} verder!`;

  const waarden = { kwaliteit_eieren: 0, contact_ervaring: 0, bezorg_betrouwbaarheid: 0, koopreden: new Set(), aanbeveling: null };

  inhoud.innerHTML = `
    <p class="intro">Uw mening maakt het verschil voor ${esc(naam)} om een betere verkoper te worden! Vul in 2 minuten deze korte vragenlijst in — dat helpt enorm.</p>

    ${sterrenHtml('kwaliteit_eieren', 'Hoe beoordeelt u de kwaliteit van de eieren?')}
    ${sterrenHtml('contact_ervaring', `Hoe ervaart u het contact met ${esc(naam)}?`)}
    ${sterrenHtml('bezorg_betrouwbaarheid', 'Hoe beoordeelt u de betrouwbaarheid van de bezorging?')}

    <label>Waarom koopt u bij Eggspress? <span style="font-weight:400;color:var(--muted)">(meerdere mogelijk)</span></label>
    <div class="chips" id="chips-koopreden">${KOOPREDENEN.map(k => `<div class="chip" data-w="${esc(k)}">${esc(k)}</div>`).join('')}</div>

    <label>Wat betekent ${esc(naam)} voor u in de buurt?</label>
    <textarea id="in-buurt" placeholder="Vrij in te vullen..."></textarea>

    <label>Zou u ${esc(naam)} aanbevelen bij buren/vrienden?</label>
    <div class="jn" id="jn-aanbeveling"><button type="button" data-w="ja">Ja</button><button type="button" data-w="nee">Nee</button></div>
    <textarea id="in-aanbeveling-toelichting" placeholder="Toelichting (optioneel)" style="margin-top:10px"></textarea>

    <label>Geeft u ${esc(naam)} één tip?</label>
    <textarea id="in-tip" placeholder="Waar kan het beter?"></textarea>

    <label>Geeft u ${esc(naam)} één top?</label>
    <textarea id="in-top" placeholder="Wat ging er goed?"></textarea>

    <button class="verstuur" id="btn-verstuur">Versturen</button>
    <div class="fout" id="fout" style="display:none"></div>
    <div class="voettekst">Uw antwoorden gaan rechtstreeks naar Eggspress en helpen ${esc(naam)} persoonlijk verder.</div>
  `;

  document.querySelectorAll('.ster').forEach(el => {
    el.addEventListener('click', () => {
      const veld = el.dataset.veld, w = +el.dataset.w;
      waarden[veld] = w;
      document.querySelectorAll(`#sterren-${veld} .ster`).forEach(s => s.classList.toggle('aan', +s.dataset.w <= w));
    });
  });
  document.querySelectorAll('#chips-koopreden .chip').forEach(el => {
    el.addEventListener('click', () => {
      const w = el.dataset.w;
      if (waarden.koopreden.has(w)) { waarden.koopreden.delete(w); el.classList.remove('aan'); }
      else { waarden.koopreden.add(w); el.classList.add('aan'); }
    });
  });
  document.querySelectorAll('#jn-aanbeveling button').forEach(el => {
    el.addEventListener('click', () => {
      waarden.aanbeveling = el.dataset.w === 'ja';
      document.querySelectorAll('#jn-aanbeveling button').forEach(b => b.classList.toggle('aan', b === el));
    });
  });

  document.getElementById('btn-verstuur').addEventListener('click', async () => {
    const foutEl = document.getElementById('fout');
    foutEl.style.display = 'none';
    if (!waarden.kwaliteit_eieren || !waarden.contact_ervaring || !waarden.bezorg_betrouwbaarheid) {
      foutEl.textContent = 'Geef alstublieft alle drie de sterrenscores op.'; foutEl.style.display = ''; return;
    }
    const btn = document.getElementById('btn-verstuur');
    btn.disabled = true; btn.textContent = 'Bezig...';
    try {
      const res = await fetch(`${SB_URL}/functions/v1/feedback-opslaan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${SB_KEY}` },
        body: JSON.stringify({
          verkoper_id: verkoper.id,
          kwaliteit_eieren: waarden.kwaliteit_eieren,
          contact_ervaring: waarden.contact_ervaring,
          bezorg_betrouwbaarheid: waarden.bezorg_betrouwbaarheid,
          koopreden: [...waarden.koopreden],
          buurt_betekenis: document.getElementById('in-buurt').value.trim(),
          aanbeveling: waarden.aanbeveling,
          aanbeveling_toelichting: document.getElementById('in-aanbeveling-toelichting').value.trim(),
          tip: document.getElementById('in-tip').value.trim(),
          top: document.getElementById('in-top').value.trim(),
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.fout || 'onbekende fout');
      kopTitel.textContent = 'Bedankt! ✓';
      inhoud.innerHTML = `<div class="bedankt"><div class="emoji">🙏</div><p class="intro" style="margin:0">Ontzettend bedankt voor uw tijd — ${esc(naam)} is hier heel blij mee!</p></div>`;
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Versturen';
      foutEl.textContent = 'Versturen mislukt: ' + e.message; foutEl.style.display = '';
    }
  });
})();
</script>
</body>
</html>
